baseURL = "https://mrpurpo.github.io/"
locale = "en-us"
title = "Sebastián Morón"
theme = "hugo-bearblog"
enableRobotsTXT = true

[params]
  author = "Sebastián Morón"
  description = "Notes on technical AI safety, projects, and progress."

[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 10

[[menus.main]]
  name = "Projects"
  url = "/projects/"
  weight = 20

[[menus.main]]
  name = "CV"
  url = "/cv.pdf"
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
