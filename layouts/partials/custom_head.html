<style>
  :root {
    --font-main: Georgia, "Times New Roman", serif;
    --font-secondary: Georgia, "Times New Roman", serif;
    --background-color: #fdf6e3;
  }

  /* The theme switches to light text in dark mode, which would be unreadable
     on cream, so keep the light palette there too. */
  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #fdf6e3;
      --heading-color: #222;
      --text-color: #444;
      --link-color: #3273dc;
      --visited-color: #8b6fcb;
      --blockquote-color: #222;
    }
  }
  /* On wide screens, move the section links from under the title into a
     sidebar on the right. Narrow screens keep the theme's top nav. */
  @media (min-width: 800px) {
    body {
      max-width: 920px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      column-gap: 48px;
    }

    header {
      display: contents;
    }

    header > .title,
    main,
    footer {
      grid-column: 1;
    }

    header > nav {
      grid-column: 2;
      grid-row: 1 / span 3;
      align-self: start;
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      padding-left: 20px;
      border-left: 1px solid #d8cfb8;
    }

    header > nav a {
      margin-right: 0;
    }
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '\\[', right: '\\]', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false}
    ],
    throwOnError: false
  });"></script>
